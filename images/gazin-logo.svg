<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gazin Market Logo">
  <defs>
    <linearGradient id="gm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#148589"/>
      <stop offset="100%" stop-color="#0a4f52"/>
    </linearGradient>
    <linearGradient id="gm-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Rounded icon tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gm-bg)"/>
  <!-- Subtle inner border -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
  <!-- Shopping bag handle arc -->
  <path d="M24 22 V19 C24 14.6 27.6 11 32 11 C36.4 11 40 14.6 40 19 V22" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Stylized geometric G / bag body -->
  <path d="M46 25 H18 C15.8 25 14 26.8 14 29 V45 C14 48.9 17.1 52 21 52 H43 C46.9 52 50 48.9 50 45 V35 H33" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Choice checkmark spark inside -->
  <path d="M24 38.5 L29.2 43.5 L40.5 32.2" fill="none" stroke="url(#gm-accent)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
